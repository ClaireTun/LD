_target_: navsim.agents.recogdrive.recogdrive_agent.ReCogDriveAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
checkpoint_path: ''
vlm_path: ''
cam_type: 'single'
load_lidar: False
vlm_type: 'internvl'
dit_type: 'small'
sampling_method: 'ddim'
cache_mode: False
cache_hidden_state: True
metric_cache_path: ''
reference_policy_checkpoint: ''
vlm_size: 'small'
train_backbone: false
grpo: False
lr: 1e-4
use_sgdrive_teacher: False
sgdrive_teacher_config: ""
sgdrive_teacher_checkpoint: ""
sgdrive_teacher_feature_keys: ["scene", "agent", "goal"]
struct_distill_keys: ["scene", "agent", "goal"]
student_world_keys: ["scene", "agent", "goal"]
freeze_sgdrive_teacher: True
teacher_eval_mode: True
debug_print_teacher_shapes: False

use_student_world_adapter: False
student_world_dim: 256
student_world_num_tokens: 1
student_world_use_mlp: True
student_world_use_cross_attn: False
student_world_source: "cognition_tokens"
student_world_dropout: 0.0
use_structural_world_distill: False
struct_distill_loss_type: "cosine"
struct_distill_weight: 1.0
scene_distill_weight: 1.0
agent_distill_weight: 1.0
goal_distill_weight: 1.0
dream_scene_distill_weight: 1.0
dream_agent_distill_weight: 1.0
detach_teacher: True
normalize_distill_features: True

use_world_tokens_as_planner_condition: False
world_condition_fusion_type: "concat"
world_condition_detach: False
world_condition_weight: 1.0

teacher_feature_source: "cached"

use_world_denoise_influence: False
world_denoise_influence_type: "cross_attn"
use_world_denoise_cross_attn: False
use_world_denoise_film: False
world_denoise_dim: 256
world_denoise_num_heads: 4
world_denoise_dropout: 0.0
world_denoise_use_scene: True
world_denoise_use_agent: True
world_denoise_use_goal: True
world_denoise_pooling: "none"
world_denoise_apply_layers: []
world_denoise_apply_steps: "all"
world_denoise_custom_steps: []
world_denoise_residual_scale: 1.0
world_denoise_gate_init: -2.0
world_denoise_detach_world_tokens: False
debug_world_denoise_influence: False

# Checkpoint compatibility for legacy ReCogDrive / student / DriveMem checkpoints.
checkpoint_state_key: "state_dict"
auto_configure_from_checkpoint: True
strict_checkpoint_loading: False

# DriveMem is off for the baseline model, but auto_configure_from_checkpoint
# enables and sizes it when a DriveMem checkpoint contains drivemem.* tensors.
drivemem:
  enabled: False
  use_dsu_side_branch: True
  use_dsu_main_path: False
  dsu_type: "token"
  detach_side_branch: True
  use_ifa: True
  use_pmb: True
  use_memory_fusion: True
  memory_dim: 256
  ifa_dim: 256
  ifa_pooling: "mean"
  num_prototypes: 128
  top_k: 8
  temperature: 0.07
  normalize_query: True
  normalize_memory: True
  memory_weight_mode: "soft"
  memory_gate_init_bias: -2.0
  lambda_mem_init: 0.1
  train_lambda_mem: True